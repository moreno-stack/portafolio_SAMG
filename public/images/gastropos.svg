      <stop offset="0%" stop-color="#F7F5F0" />
      <stop offset="100%" stop-color="#E9E3D8" />
    </linearGradient>
    <pattern id="grid-pos" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#18181B" stroke-width="0.6" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg-pos)" />
